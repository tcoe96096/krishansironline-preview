# Dedicated Preview deployment. This workflow never deploys the production site.
name: Deploy Full Website Redesign Preview

on:
  workflow_dispatch:
  repository_dispatch:
    types: [preview-source-updated]
  schedule:
    # Refresh the Preview from the approved source branch every six hours.
    - cron: '17 */6 * * *'
  push:
    branches: ["main"]
    paths: [".github/workflows/pr22-preview.yml"]

permissions:
  contents: read

concurrency:
  group: preview-site
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout approved Preview source
        uses: actions/checkout@v4
        with:
          repository: tcoe96096/krishansironline
          ref: preview/student-system-live-design-integration
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        working-directory: source
        run: npm run lint

      - name: Build website for Preview
        working-directory: source
        env:
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build -- --base=/krishansironline-preview/

      # Keep the production-based student candidate isolated from the full redesign preview; refresh from the latest verified Student Release Candidate commit.
      - name: Checkout Student Release Candidate
        uses: actions/checkout@v4
        with:
          repository: tcoe96096/krishansironline
          ref: feature/student-learning-progress-production
          path: student-candidate

      - name: Install Student Release Candidate dependencies
        working-directory: student-candidate
        run: npm install --legacy-peer-deps

      - name: Validate Student Release Candidate TypeScript
        working-directory: student-candidate
        run: npm run lint

      - name: Build Student Release Candidate in isolated subpath
        working-directory: student-candidate
        env:
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build -- --base=/krishansironline-preview/student-release-candidate/

      - name: Add Student Release Candidate to Preview artifact
        run: |
          mkdir -p source/dist/student-release-candidate
          cp -a student-candidate/dist/. source/dist/student-release-candidate/

      - name: Create separate Admin Preview entry URLs
        working-directory: source
        run: |
          mkdir -p dist/admin dist/admin-preview
          cp dist/index.html dist/admin/index.html
          cp dist/index.html dist/admin-preview/index.html

      - name: Verify generated Preview pages
        working-directory: source
        run: |
          set -eu
          test -s dist/index.html
          test -s dist/admin/index.html
          test -s dist/admin-preview/index.html
          test -s dist/classes/index.html
          test -s dist/online-tests/index.html
          test -s dist/study-materials/index.html
          test -s dist/results/index.html
          test -s dist/constitution/index.html
          test -s dist/current-affairs/index.html
          test -s dist/about/index.html
          test -s dist/contact/index.html
          test -s dist/student-release-candidate/index.html
          test -s dist/student-release-candidate/classes/index.html
          test -s dist/student-release-candidate/online-tests/index.html
          test -s dist/student-release-candidate/study-materials/index.html
          echo "All Preview and Student Release Candidate entry pages are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

  deploy:
    name: Publish Preview only
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Preview site
        id: deployment
        uses: actions/deploy-pages@v4
