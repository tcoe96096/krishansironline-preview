# Dedicated preview deployment for the latest full website redesign and review updates.
name: Deploy Full Website Redesign Preview # refresh after header layout update

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/pr22-preview.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout redesign source
        uses: actions/checkout@v4
        with:
          repository: tcoe96096/krishansironline
          ref: full-site-redesign-preview
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm install --legacy-peer-deps

      - name: Build redesign for preview URL
        working-directory: source
        run: npm run build -- --base=/krishansironline-preview/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview site
        id: deployment
        uses: actions/deploy-pages@v4
