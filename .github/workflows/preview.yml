name: Deploy PR #20 preview to GitHub Pages # refresh after approved logo fix

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "preview-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout website PR #20 source
        uses: actions/checkout@v4
        with:
          repository: tcoe96096/krishansironline
          ref: design/separate-header-hero-backgrounds
          path: website

      - name: Checkout main branch assets
        uses: actions/checkout@v4
        with:
          repository: tcoe96096/krishansironline
          ref: main
          path: main-assets

      - name: Restore Header background image from main
        run: |
          mkdir -p website/public/images
          cp main-assets/public/images/file_00000000eb6482108586a0d9a2d631c8.png website/public/images/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm install --legacy-peer-deps

      - name: Remove production custom-domain file
        working-directory: website
        run: rm -f public/CNAME

      - name: Build preview for GitHub Pages project path
        working-directory: website
        run: npm run build -- --base=/krishansironline-preview/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4









